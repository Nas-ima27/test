server {
    # Nginx écoute sur le port 80 à l'intérieur du conteneur
    # (le port réellement exposé à l'extérieur sera défini dans
    # docker-compose.yml, ex: 8080:80).
    listen 80;

    # Dossier contenant les fichiers buildés par Vite (copiés depuis
    # l'étape "builder" du Dockerfile).
    root /usr/share/nginx/html;
    index index.html;

    # Point le plus important pour une SPA (Single Page Application) :
    # React Router gère la navigation côté client (ex: /espace-stagiaire/journal),
    # mais ces routes n'existent pas comme vrais fichiers sur le serveur.
    # Sans cette règle, recharger la page sur une route comme
    # /espace-stagiaire/journal donnerait une erreur 404 Nginx, car il
    # chercherait un fichier "journal" qui n'existe pas.
    # "try_files" essaie d'abord le fichier demandé ($uri), puis un
    # dossier ($uri/), et si rien ne correspond, renvoie toujours
    # index.html — laissant React Router prendre le relais côté client
    # pour afficher la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache agressive des fichiers statiques versionnés par Vite
    # (ils ont un hash dans leur nom, ex: index-a1b2c3.js — donc un
    # changement de contenu = un nouveau nom de fichier, le cache long
    # ne pose jamais de problème de contenu périmé).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compression gzip — réduit la taille des fichiers envoyés au
    # navigateur, accélère le chargement.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}